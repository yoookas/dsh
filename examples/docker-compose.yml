# docker compose 示例（宿主机目录绑定挂载）
#
# 用法：
#   1. 从 Release 下载镜像包并加载：docker load -i dsh-<tag>-linux-amd64.tar.gz
#   2. 在本目录创建 .env：echo 'SSH_ROOT_PASSWORD=换成你的密码' > .env
#   3. docker compose up -d
#
# 三个目录都会自动创建，首次启动时：
#   ./dsh-data  —— 空的，DSH 会初始化会话/配置
#   ./ssh       —— 空的，首次启动会生成 sshd_config 与主机密钥（之后就固定了）
#   ./workspaces—— 空的，在 Web UI 里把 /workspace 添加为工作区即可使用
services:
  dsh:
    # 与 Release tag 保持一致（上游 devtools-<版本>），例如 devtools-0.2.2-rc.5
    image: dsh:devtools-0.2.2-rc.5
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"   # DSH Web（上游默认对外端口）
      - "2222:22"     # SSH；宿主机 22 空闲时可直接写 "22:22"
    environment:
      # root 密码：只在容器启动时写入，不打进镜像
      SSH_ROOT_PASSWORD: ${SSH_ROOT_PASSWORD:?请在 .env 里设置 SSH_ROOT_PASSWORD}
      # 更安全的做法：用公钥登录并关掉密码登录
      # SSH_AUTHORIZED_KEYS: "ssh-ed25519 AAAAC3Nza... you@laptop"
      # SSH_PASSWORD_AUTHENTICATION: "no"
      # SSH_PERMIT_ROOT_LOGIN: "prohibit-password"

      # 可选的 Web Basic Auth（上游代理功能）
      # PROXY_USERNAME: admin
      # PROXY_PASSWORD: changeme
    volumes:
      # DSH 的会话 / 配置数据
      - ./dsh-data:/root/.dsh
      # SSH 主机密钥 + sshd 配置；挂上之后容器重建也不会变指纹
      - ./ssh:/etc/ssh
      # 工作区：容器里的 /workspace，Web UI 里添加为工作区即可
      - ./workspaces:/workspace
    healthcheck:
      test: ["CMD", "/usr/local/bin/dsh-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
